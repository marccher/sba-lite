name: Docker Build & Publish

on:
  push:
    tags:
      - "v*.*.*" # Si attiva quando crei un tag di versione (es. v0.1.1)
  workflow_dispatch: # Ti permette di avviarlo manualmente per fare i test

permissions:
  contents: read
  packages: write # Necessario per pubblicare l'immagine su GitHub Packages (GHCR)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # Diventerà ghcr.io/tuo-utente/sba-lite

jobs:
  push_to_registry:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Gestito in automatico da GitHub

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
