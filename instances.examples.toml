# Complete configuration for the Rust server: general settings + instances
# to monitor. This file is meant to be freely edited by the user, without
# touching the code — no reference to a Java backend remains in the code:
# this is the single source of configuration.

[server]
port = 9001                      # port the Rust server listens on
poll_interval_secs = 10          # how often to poll the remote actuators
insecure_tls = false             # true ONLY for local targets with self-signed certs
# ca_cert_path = "/path/to/internal-ca.pem"  # trust an internal/corporate CA in ADDITION to the OS trust store
# ca_cert_path = ["/path/to/ca-a.pem", "/path/to/ca-b.pem"]  # or a list, if you have multiple different internal CAs
log_level = "info"                # "info" (default) | "debug" (log every remote call) | "trace" (+ health response body)
journal_max_events = 5000         # circular buffer: beyond this number, the oldest journal events are discarded
# auth_username = "admin"         # if BOTH are set, protects UI and API with HTTP Basic Auth
# auth_password = "change-this-password"

# Static configuration of the instances to monitor.
# Rust queries these actuators directly (health + discovery + info), no
# more dynamic registration via a Java backend.
#
# "name" is both the name shown in the UI and the unique identifier used in
# detail calls (/instances/{name}/...): it must be unique and stable, don't
# change it once chosen.
#
# "bearer_token" should be left ABSENT for instances that don't require
# authentication: an expired or unnecessary token causes a 401 even if the
# instance is perfectly UP (this has happened in practice).

[[instance]]
name = "my-service"
actuator_base_url = "https://host/context/actuator"

# Example of an instance that requires Bearer/JWT authentication towards
# the actuator:
[[instance]]
name = "my-secured-service"
actuator_base_url = "https://host/context/actuator"
bearer_token = "PASTE_YOUR_TOKEN_HERE"

# Add other instances here following the same pattern.